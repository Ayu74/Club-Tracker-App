<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Tracker</title>
<style>
:root{--bg:#f3f5f7;--cd:#fff;--tx:#14202b;--mu:#64748b;--ac:#0f766e;--ab:#ccfbf1;--ok:#15803d;--ob:#dcfce7;--bd:#e2e8f0;--in:#f8fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--cd:#18212a;--tx:#e6edf3;--mu:#8b9bab;--ac:#2dd4bf;--ab:#134e4a;--ok:#4ade80;--ob:#14532d;--bd:#2a3642;--in:#111a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--cd:#18212a;--tx:#e6edf3;--mu:#8b9bab;--ac:#2dd4bf;--ab:#134e4a;--ok:#4ade80;--ob:#14532d;--bd:#2a3642;--in:#111a22;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--bd)}
h1{font-size:13px;margin:0 0 6px;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
select,input{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:11px 12px}
select{font-weight:600}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1;min-width:0}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
.pg{height:6px;background:var(--bd);border-radius:9px;margin-top:10px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pt{font-size:13px;color:var(--mu);margin-top:4px}
.note{font-size:13px;color:var(--mu);margin:2px 0 0}
main{padding:10px 12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;width:100%;text-align:left;color:var(--tx);font:inherit}
.cd.dn{border-left:5px solid var(--ok)}
.sr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ab);color:var(--ac);display:grid;place-items:center;font-size:13px;font-weight:700}
.nm{font-weight:650;font-size:15px}.sb{font-size:13px;color:var(--mu)}
.bd{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pl{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--bd);color:var(--mu)}.pl.ok{background:var(--ob);color:var(--ok);font-weight:600}
.em{text-align:center;color:var(--mu);padding:40px 0}
footer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--cd);border-top:1px solid var(--bd);display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
footer button{flex:1;border:0;border-radius:12px;padding:13px 6px;font:inherit;font-weight:650;background:var(--ac);color:var(--bg)}
footer button.alt{background:var(--ab);color:var(--ac)}
#ed{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#ed.open{display:flex}
.sh{background:var(--cd);width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0;font-size:18px}.sh .sb{margin:2px 0 8px}
.gp{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
.dr{display:flex;gap:6px}.dr input{flex:1}
.dr button,.yn button{border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:0 14px;font:inherit;min-height:44px}
.yn{display:flex;gap:8px}.yn button{flex:1}.yn button.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
.nv{display:flex;gap:8px;margin-top:18px}.nv button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-weight:600}
.nv .pr{background:var(--ac);color:var(--bg);border-color:var(--ac)}
#ts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;display:none;max-width:90%}
</style></head><body>
<header>
 <h1>Club Tracker</h1>
 <select id="sh"></select><p class="note" id="nt"></p>
 <div class="chips" id="mc"></div>
 <div class="row"><input id="q" type="search" placeholder="Search name or MSL…"><select id="ar"></select></div>
 <div class="chips" id="fc"></div>
 <div class="pg"><i id="pb"></i></div><div class="pt" id="pt"></div>
</header>
<main id="ls"></main>
<footer><button class="alt" id="d1">⬇ This sheet</button><button id="d2">⬇ Full Excel</button></footer>
<div id="ed"><div class="sh" id="eb"></div></div><div id="ts"></div>

const $=s=>document.getElementById(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=(r,c)=>(E[U.si]&&E[U.si][r+':'+c])||'';
function put(r,c,v){const o=E[U.si]=E[U.si]||{};if(v==='')delete o[r+':'+c];else o[r+':'+c]=v;try{localStorage.setItem('ct_e',JSON.stringify(E))}catch(e){}}
const sv=()=>{try{localStorage.setItem('ct_u',JSON.stringify(U))}catch(e){}};
const cur=()=>D[U.si],dcols=()=>cur().cols.filter(c=>c.k=='date'),mons=()=>[...new Set(dcols().map(c=>c.m))];
const nm=r=>r.n||g(r.r,'B');
const isDone=r=>dcols().filter(c=>!U.m||c.m==U.m).some(c=>g(r.r,c.c));
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function head(){
  $('sh').innerHTML=D.map((s,i)=>`<option value="${i}" ${i==U.si?'selected':''}>${esc(s.n)} (${s.rows.length})</option>`).join('');
  $('nt').textContent=cur().note;
  if(U.m&&!mons().includes(U.m))U.m='';
  $('mc').innerHTML=['',...mons()].map(m=>`<button class="chip ${U.m==m?'on':''}" data-m="${m}">${m||'All months'}</button>`).join('');
  $('fc').innerHTML=[['all','All'],['p','Pending'],['d','Done']].map(([k,l])=>`<button class="chip ${U.f==k?'on':''}" data-f="${k}">${l}</button>`).join('');
  const ar=[...new Set(cur().rows.map(r=>r.a).filter(Boolean))].sort();
  $('ar').innerHTML='<option value="">All areas</option>'+ar.map(a=>`<option ${a==U.a?'selected':''}>${esc(a)}</option>`).join('');
}
function list(){
  const q=U.q.toLowerCase(),rows=cur().rows;let done=0;
  rows.forEach(r=>{if(isDone(r))done++});
  $('pb').style.width=(rows.length?done/rows.length*100:0)+'%';
  $('pt').textContent=`${done} of ${rows.length} visited${U.m?' in '+U.m:''}`;
  VIS=[];rows.forEach((r,i)=>{
    if(U.a&&r.a!=U.a)return;
    if(q&&!(nm(r)+' '+r.ms+' '+r.a).toLowerCase().includes(q))return;
    const d=isDone(r);if(U.f=='p'&&d||U.f=='d'&&!d)return;VIS.push(i)});
  $('ls').innerHTML=VIS.length?VIS.map(i=>{const r=rows[i],d=isDone(r);
    const pills=dcols().map(c=>{const v=g(r.r,c.c);return `<span class="pl ${v?'ok':''}">${c.l.trim()} ${v?'✓ '+v.slice(8)+'/'+v.slice(5,7):'–'}</span>`}).join('');
    return `<button class="cd ${d?'dn':''}" data-i="${i}"><span class="sr">${r.sr}</span><span><div class="nm">${esc(nm(r)||'Tap to add name')}</div><div class="sb">MSL ${esc(r.ms||g(r.r,'C')||'–')} · ${esc(r.a||g(r.r,'D')||'–')}</div><div class="bd">${pills}</div></span></button>`}).join(''):'<div class="em">No matches</div>';
}
const draw=()=>{head();list();sv()};
function fld(r,c){const v=g(r.r,c.c),id=`data-c="${c.c}"`;
  if(c.k=='date')return `<label>${esc(c.l)}</label><div class="dr"><input type="date" ${id} value="${v}"><button data-t="${c.c}">Today</button><button data-x="${c.c}">✕</button></div>`;
  if(c.k=='yn')return `<label>${esc(c.l)}</label><div class="yn">${['Y','N'].map(x=>`<button data-y="${c.c}:${x}" class="${v==x?'on':''}">${x=='Y'?'Yes':'No'}</button>`).join('')}</div>`;
  return `<label>${esc(c.l)}</label><input ${id} ${c.k=='num'?'inputmode="decimal"':''} value="${esc(v)}">`}
function openEd(i){
  ED=i;const r=cur().rows[i],cols=(r.ed?cur().det:[]).concat(cur().cols),gs=[];
  cols.forEach(c=>{const k=c.m||(c.g||'General');let o=gs.find(x=>x.k==k);if(!o)gs.push(o={k,c:[]});o.c.push(c)});
  const p=VIS.indexOf(i);
  $('eb').innerHTML=`<h2>${esc(nm(r)||'New entry')}</h2><div class="sb">#${r.sr} · MSL ${esc(r.ms||'–')} · ${esc(r.a||'–')}</div>`+
   gs.map(o=>`<div class="gp">${esc(o.k)}</div>${o.c.map(c=>fld(r,c)).join('')}`).join('')+
   `<div class="nv"><button data-n="-1" ${p<1?'disabled':''}>← Prev</button><button class="pr" data-n="0">Done</button><button data-n="1" ${p>=VIS.length-1?'disabled':''}>Next →</button></div>`;
  $('ed').classList.add('open');$('eb').scrollTop=0;
}
const closeEd=()=>{$('ed').classList.remove('open');ED=-1;list()};
$('eb').addEventListener('input',e=>{const c=e.target.dataset.c;if(c&&ED>=0)put(cur().rows[ED].r,c,e.target.value)});
$('eb').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||ED<0)return;const r=cur().rows[ED],d=b.dataset;
  if(d.t!=null||d.x!=null){const c=d.t||d.x,n=new Date(),v=d.t?`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`:'';put(r.r,c,v);openEd(ED)}
  else if(d.y){const[c,x]=d.y.split(':');put(r.r,c,g(r.r,c)==x?'':x);openEd(ED)}
  else if(d.n!=null){const n=+d.n;if(!n)return closeEd();const p=VIS.indexOf(ED)+n;if(VIS[p]!=null)openEd(VIS[p])}
});
$('ed').addEventListener('click',e=>{if(e.target.id=='ed')closeEd()});
$('sh').onchange=e=>{U.si=+e.target.value;U.a='';U.m='';draw()};
$('q').oninput=e=>{U.q=e.target.value;list()};
$('ar').onchange=e=>{U.a=e.target.value;list()};
$('mc').onclick=e=>{const b=e.target.closest('button');if(b){U.m=b.dataset.m;draw()}};
$('fc').onclick=e=>{const b=e.target.closest('button');if(b){U.f=b.dataset.f;draw()}};
$('ls').onclick=e=>{const b=e.target.closest('.cd');if(b)openEd(+b.dataset.i)};
// ---- XLSX engine: patches the embedded original workbook so formatting stays identical ----
const colIdx=c=>c.split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0);
const xesc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const serial=v=>{const[y,m,d]=v.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)+25569};
function widen(xml,want){
  const m=xml.match(/<cols>([\s\S]*?)<\/cols>/),items=m?m[1].match(/<col\b[^>]*\/>/g)||[]:[],map={},raw=[];
  items.forEach(t=>{const mn=+t.match(/min="(\d+)"/)[1],mx=+t.match(/max="(\d+)"/)[1],w=+(t.match(/width="([\d.]+)"/)||[0,9])[1];
    if(mn==mx)map[mn]={mn,w};else raw.push({mn,t})});
  const inRange=n=>raw.some(r=>{const a=+r.t.match(/min="(\d+)"/)[1],b=+r.t.match(/max="(\d+)"/)[1];return n>=a&&n<=b});
  for(const c in want){const n=colIdx(c);if(inRange(n))continue;if(map[n])map[n].w=Math.max(map[n].w,want[c]);else map[n]={mn:n,w:want[c]}}
  const out=Object.values(map).map(o=>({mn:o.mn,t:`<col min="${o.mn}" max="${o.mn}" width="${o.w}" customWidth="1"/>`})).concat(raw).sort((a,b)=>a.mn-b.mn);
  const blk='<cols>'+out.map(o=>o.t).join('')+'</cols>';
  if(m)return xml.replace(m[0],()=>blk);
  return xml.replace(/(<sheetFormatPr[^>]*\/>)/,(s)=>s+blk);
}
async function buildXlsx(only,active){
  const z=await JSZip.loadAsync(XL,{base64:true});
  let st=await z.file('xl/styles.xml').async('string');
  const sm=st.match(/<cellXfs count="\d+">([\s\S]*?)<\/cellXfs>/),xfs=sm[1].match(/<xf\b[^>]*\/>|<xf\b[^>]*>[\s\S]*?<\/xf>/g),clone={};
  const dstyle=s=>{if(clone[s]==null){let x=xfs[s].replace('numFmtId="0"','numFmtId="15"');if(!/applyNumberFormat/.test(x))x=x.replace('<xf ','<xf applyNumberFormat="1" ');xfs.push(x);clone[s]=xfs.length-1}return clone[s]};
  let wb=await z.file('xl/workbook.xml').async('string'),rl=await z.file('xl/_rels/workbook.xml.rels').async('string'),ct=await z.file('[Content_Types].xml').async('string');
  for(let i=0;i<D.length;i++){
    const sh=D[i],p='xl/worksheets/'+sh.file;
    if(only!=null&&i!==only){
      wb=wb.replace(new RegExp('<sheet [^>]*r:id="'+sh.rid+'"[^>]*/>'),'');
      rl=rl.replace(new RegExp('<Relationship [^>]*Id="'+sh.rid+'"[^>]*/>'),'');
      ct=ct.replace(new RegExp('<Override [^>]*PartName="/xl/worksheets/'+sh.file+'"[^>]*/>'),'');
      z.remove(p);continue;
    }
    let xml=(await z.file(p).async('string')).replace(/ tabSelected="1"/,''),want={};
    const ed=E[i]||{};
    for(const key in ed){
      const v=ed[key];if(v==='')continue;
      const[r,c]=key.split(':'),col=sh.cols.find(x=>x.c==c)||{k:c=='C'?'num':'text'};
      const re=new RegExp('<c r="'+c+r+'"([^>]*?)(?:/>|>[\\s\\S]*?</c>)'),mm=xml.match(re);
      const s=mm?+((mm[1].match(/ s="(\d+)"/)||[0,0])[1]):0;
      let cell;
      if(col.k=='date'){cell=`<c r="${c}${r}" s="${dstyle(s)}"><v>${serial(v)}</v></c>`;want[c]=11.5}
      else if(col.k=='num'&&v.trim()!==''&&isFinite(v)){cell=`<c r="${c}${r}" s="${s}"><v>${+v}</v></c>`;want[c]=10}
      else{cell=`<c r="${c}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;if(col.k!='text'||c>'D')want[c]=12}
      if(mm)xml=xml.replace(mm[0],()=>cell);
      else xml=xml.replace(new RegExp('(<row r="'+r+'"[^>]*>[\\s\\S]*?)(</row>)'),(a,b,e)=>b+cell+e);
    }
    z.file(p,widen(xml,want));
  }
  wb=wb.replace(/ firstSheet="\d+"/,'').replace(/ activeTab="\d+"/,only==null?` activeTab="${active||0}"`:'');
  z.file('xl/workbook.xml',wb);z.file('xl/_rels/workbook.xml.rels',rl);z.file('[Content_Types].xml',ct);
  z.file('xl/styles.xml',st.replace(sm[0],()=>`<cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs>`));
  return z.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

async function dl(only){
  try{toast('Preparing Excel…');
    const blob=await buildXlsx(only,U.si),name=(only==null?'Club_Tracker':cur().n.replace(/[^\w]+/g,'_'))+'_Updated.xlsx';
    const C=window.Capacitor;
    if(C&&C.isNativePlatform&&C.isNativePlatform()){
      const b64=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(blob)});
      const P=C.Plugins;await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
      const u=await P.Filesystem.getUri({path:name,directory:'CACHE'});
      await P.Share.share({title:name,url:u.uri,dialogTitle:'Save or send the Excel file'});toast('Ready ✓');return}
    const dm=window.claude&&await claude.use('downloads');
    if(dm){await dm.save({filename:name,data:blob});toast('Saved ✓')}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Downloaded ✓')}
  }catch(err){toast(/cancel|declined/i.test((err&&(err.code||err.message))||'')?'Cancelled':'Download failed — try again')}
}
$('d1').onclick=()=>dl(U.si);$('d2').onclick=()=>dl(null);
draw();
</script></body></html>
